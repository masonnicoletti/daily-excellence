<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}A short, thoughtful essay every morning on one idea for living well.{% endblock %}">
  <link rel="icon" href="{{ root }}icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{ root }}icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ root }}icons/apple-touch-icon.png">
  <link rel="manifest" href="{{ root }}site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Excellence">
  <meta name="theme-color" content="#f3ebdd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    /* Apply a saved dark-mode choice before the page paints (light is the default). */
    document.documentElement.classList.add("js");  /* favorite stars only appear when scripts run */
    try { if (localStorage.getItem("de-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <script>
    /* Essays are prepared the evening before. Hide any essay whose release time
       ({{ release_hour }}:00 {{ timezone }} on its date) hasn't come yet, before the page paints.
       Elements carry data-release="YYYY-MM-DD"; window.DE_UNRELEASED lists hidden dates. */
    (function () {
      var hidden = [];
      try {
        var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "{{ timezone }}", year: "numeric",
              month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" }).formatToParts(new Date()),
            o = {};
        parts.forEach(function (x) { o[x.type] = x.value; });
        var today = o.year + "-" + o.month + "-" + o.day;
        var plus = function (n) { var d = new Date(today + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
        hidden = [plus(1), plus(2)];
        if (Number(o.hour) < {{ release_hour }}) hidden.unshift(today);
        var css = hidden.map(function (d) {
          var sel = '[data-release="' + d + '"]';
          return sel + "{display:none!important}" + sel + "~.hero-fallback," + sel + "~.recent-extra{display:block}";
        }).join("");
        var style = document.createElement("style");
        style.textContent = css;
        document.head.appendChild(style);
      } catch (e) {}
      window.DE_UNRELEASED = hidden;
    })();
  </script>
  <link rel="stylesheet" href="{{ root }}style.css">
  <script src="{{ root }}favorites.js" defer></script>
</head>
<body>
  {% if preview %}<div class="preview-banner">Local preview of draft essays. Not published.</div>{% endif %}
  <header class="masthead">
    <a class="brand" href="{{ root }}index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>{{ site_title }}</span>
    </a>
    <div class="masthead-actions">
      {% block masthead_button %}<a class="masthead-button" href="{{ root }}archive.html">Archive</a>{% endblock %}
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ disclaimer }}</p>
  </footer>
  <script>
    (function () {
      var root = document.documentElement, btn = document.querySelector(".theme-toggle");
      if (!btn) return;
      function sync() {
        var dark = root.dataset.theme === "dark", label = dark ? "Switch to light mode" : "Switch to dark mode";
        btn.setAttribute("aria-pressed", String(dark));
        btn.setAttribute("aria-label", label);
        btn.title = label;
      }
      btn.addEventListener("click", function () {
        var dark = root.dataset.theme !== "dark";
        if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
        try { localStorage.setItem("de-theme", dark ? "dark" : "light"); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
