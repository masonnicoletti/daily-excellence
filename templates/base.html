<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}A short, thoughtful essay every morning on one idea for living well.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <script>
    /* Apply a saved dark-mode choice before the page paints (light is the default). */
    try { if (localStorage.getItem("de-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
  {% if preview %}<div class="preview-banner">Local preview of draft essays. Not published.</div>{% endif %}
  <header class="masthead">
    <a class="brand" href="{{ root }}index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>{{ site_title }}</span>
    </a>
    <div class="masthead-actions">
      <a class="masthead-link" href="{{ root }}index.html#archive">Archive</a>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ disclaimer }}</p>
  </footer>
  <script>
    (function () {
      var root = document.documentElement, btn = document.querySelector(".theme-toggle");
      if (!btn) return;
      function sync() {
        var dark = root.dataset.theme === "dark", label = dark ? "Switch to light mode" : "Switch to dark mode";
        btn.setAttribute("aria-pressed", String(dark));
        btn.setAttribute("aria-label", label);
        btn.title = label;
      }
      btn.addEventListener("click", function () {
        var dark = root.dataset.theme !== "dark";
        if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
        try { localStorage.setItem("de-theme", dark ? "dark" : "light"); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
