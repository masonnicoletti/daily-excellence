<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}A short, thoughtful essay every morning on one idea for living well.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
  {% if preview %}<div class="preview-banner">Local preview of draft essays. Not published.</div>{% endif %}
  <header class="masthead">
    <a class="brand" href="{{ root }}index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>{{ site_title }}</span>
    </a>
    <a class="masthead-link" href="{{ root }}index.html#archive">Archive</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ disclaimer }}</p>
  </footer>
</body>
</html>
