name: Daily Excellence

on:
  schedule:
    # GitHub cron is UTC and often starts late, so run early.
    # 08:30 UTC = 3:30 AM EST / 4:30 AM EDT. The 09:30 run is a backup
    # (it does nothing if today's post already exists).
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:                     # redeploy (no new essay) when code or templates change
    branches: [main]
    paths-ignore: ["data/posts/**", "data/history.json"]

permissions:
  contents: write           # commit the new post
  pages: write
  id-token: write

concurrency:
  group: daily-excellence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Generate today's essay
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
        run: python -m daily_excellence.pipeline

      - name: Render site only
        if: github.event_name == 'push'
        env:
          PYTHONPATH: src
        run: python -m daily_excellence.pipeline --render-only

      - name: Commit new post
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-excellence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts data/history.json
          if git diff --cached --quiet; then
            echo "No new post to commit."
          else
            git commit -m "Daily Excellence: $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
