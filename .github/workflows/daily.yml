name: Daily Excellence

on:
  schedule:
    # GitHub's cron is UTC and best-effort: runs have started 6-10 hours late.
    # So the essay is prepared the evening before. From 5 PM Eastern a run writes
    # tomorrow's essay (pipeline.edition_date); the site reveals it at 5 AM Eastern.
    # Only the first run that starts does any work; later ones find the post and skip.
    # Off-peak minute (:47). Eastern times are EST / EDT.
    - cron: "47 22 * * *"   #  5:47 PM /  6:47 PM  (prepares tomorrow)
    - cron: "47 0 * * *"    #  7:47 PM /  8:47 PM
    - cron: "47 2 * * *"    #  9:47 PM / 10:47 PM
    - cron: "47 4 * * *"    # 11:47 PM / 12:47 AM
    - cron: "47 6 * * *"    #  1:47 AM /  2:47 AM
    - cron: "47 8 * * *"    #  3:47 AM /  4:47 AM
    - cron: "47 11 * * *"   #  6:47 AM /  7:47 AM  (catch-up: today's essay if all else missed)
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:                     # redeploy (no new essay) when code or templates change
    branches: [main]
    paths-ignore: ["data/posts/**", "data/history.json"]

permissions:
  contents: write           # commit the new post
  pages: write
  id-token: write

concurrency:
  group: daily-excellence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Generate today's essay
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
        run: python -m daily_excellence.pipeline

      - name: Render site only
        if: github.event_name == 'push'
        env:
          PYTHONPATH: src
        run: python -m daily_excellence.pipeline --render-only

      - name: Commit new post
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-excellence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts data/history.json
          if git diff --cached --quiet; then
            echo "No new post to commit."
          else
            post=$(git diff --cached --name-only --diff-filter=A -- data/posts | head -n 1)
            git commit -m "Daily Excellence: $(basename "${post:-new-post.json}" .json)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
